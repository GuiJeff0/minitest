apiVersion: apps/v1
kind: Deployment
metadata:
  name: minitest-api
  namespace: apps
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: minitest-api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
