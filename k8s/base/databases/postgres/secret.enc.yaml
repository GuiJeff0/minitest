# Placeholder SOPS-encrypted Secret.
# Populate POSTGRES_PASSWORD in a temporary *.dec.yaml file and encrypt with:
#   sops --encrypt k8s/base/databases/postgres/secret.dec.yaml > k8s/base/databases/postgres/secret.enc.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: databases
type: Opaque
stringData:
  POSTGRES_PASSWORD: "ENC[AES256_GCM,data:PLACEHOLDER_ENCRYPT_WITH_SOPS,type:str]"
